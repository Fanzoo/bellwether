# The test suite against the Rust brain, the cargo tests, the cross-platform check
# (distribution plan, milestones 2 and 11), an unsigned universal app with its release
# files (milestone 9, plan D7), and Windows (Windows plan W1): the whole workspace checked
# and tested on windows-2025, and the test folder the maintainer checks by hand.
#
# Needs no secrets: nothing here signs with a Developer ID, notarizes or publishes, no job
# names an environment, and the token has read access only, so a pull request from a fork
# runs all of it and reaches nothing of the release's. release.yml (a pushed `v*` tag) is
# the only workflow that reaches the signing environment. Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Node the test suite and the dev scripts run on (package.json engines: >= 22.9).
  NODE_VERSION: "22.14.0"

jobs:
  suite:
    name: Test suite against the Rust brain (npm test)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target-dev
          key: cargo-suite-${{ runner.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      # What the suite reads besides the checkout, as a developer's machine has it:
      - name: Every platform's crates (the THIRD-PARTY.md check reads their licences)
        run: cargo fetch --locked --manifest-path shell/src-tauri/Cargo.toml
      - name: The conformance build npm test needs (debug, into target-dev/; tester-m8 runs its --locate)
        run: npm run build:dev
      - name: The pet art, pinned and sha256-checked (fetched, never committed; see NOTICE)
        run: node scripts/fetch-pets.mjs
      - name: npm test
        run: npm test
      - name: Bellwether's own pets match their sources (plan D8)
        run: node scripts/build-pet.mjs --check

  cargo:
    name: Rust tests (npm run test:cargo)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target-dev
          key: cargo-debug-${{ runner.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - name: npm run test:cargo
        run: npm run test:cargo
      - name: cargo test with the conformance feature
        run: cargo test --manifest-path shell/src-tauri/Cargo.toml --workspace --features bellwether-shell/conformance

  bundle:
    name: Unsigned universal app, DMG and updater files; no hidden commands
    # The same image and toolchain as release.yml's signing job.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust toolchain (release.yml's), both Mac targets
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default 1.99.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target-dev
          key: cargo-bundle-${{ runner.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - name: The Tauri CLI (shell/package-lock.json pins it, with hashes)
        run: npm ci --prefix shell
      # `tauri build` compiles with `cargo build --release` and no features, as a release
      # has; signed ad hoc (no Developer ID here), so it is the unsigned build of plan D7.
      - name: tauri build, universal, ad hoc
        run: node scripts/build-app.mjs --universal --adhoc
      - name: "`__fixture` is an unknown command in the bundled binary: exit 1"
        run: |
          home="$(mktemp -d)"
          echo '{"port": 47999}' > "$home/config.json"
          set +e
          out="$(BELLWETHER_HOME="$home" shell/src-tauri/target-dev/universal-apple-darwin/release/bundle/macos/Bellwether.app/Contents/MacOS/Bellwether __fixture 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out" | head -3
          test "$code" -eq 1
          printf '%s\n' "$out" | grep -q 'unknown command "__fixture"'
      # The release files, signed with a key made here and thrown away: proves the DMG, the
      # updater archive, latest.json and SHA256SUMS on every pull request, with no secret.
      - name: Release files with a throwaway updater key
        run: |
          set -eu
          umask 077
          keydir="$(mktemp -d)"
          pw="$(openssl rand -hex 16)"
          shell/node_modules/.bin/tauri signer generate --ci -p "$pw" -w "$keydir/throwaway.key" > /dev/null
          version="$(node -p "require('./package.json').version")"
          TAURI_SIGNING_PRIVATE_KEY_PATH="$keydir/throwaway.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$pw" \
            node scripts/release.mjs assets --app shell/src-tauri/target-dev/universal-apple-darwin/release/bundle/macos/Bellwether.app \
            --tag "v$version" --out "$RUNNER_TEMP/release" --adhoc-dmg
          rm -rf "$keydir"
          node -e "const j=require(process.argv[1]); if (Object.keys(j.platforms).sort().join() !== 'darwin-aarch64,darwin-x86_64') process.exit(1)" "$RUNNER_TEMP/release/latest.json"

  cross-check:
    name: cargo check, ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain and target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      # The platform-neutral crates only (plan D1): the brain's logic and its server.
      - name: cargo check -p bellwether-core -p bellwether-brain
        run: cargo check --manifest-path shell/src-tauri/Cargo.toml -p bellwether-core -p bellwether-brain --all-targets --target ${{ matrix.target }}

  windows:
    name: Windows (windows-2025) - workspace check, cargo tests, the test folder
    # Pinned, as release.yml pins macos-15 (Windows plan, Stack).
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git turns LF into CRLF on checkout; the source-reading tests, the
      # fixtures and the pinned pets compare bytes, so the checkout keeps the repository's.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false && git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust toolchain (release.yml's), the Windows target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.99.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target-dev
          key: cargo-windows-${{ runner.os }}-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - name: cargo check, the whole workspace, every target
        run: cargo check --locked --manifest-path shell/src-tauri/Cargo.toml --workspace --all-targets
      # Every failure in one run, not just the first crate's.
      - name: npm run test:cargo
        run: npm run test:cargo -- --no-fail-fast
      # W2: the cargo tests again with the conformance feature (the hidden `__` commands).
      - name: cargo test with the conformance feature
        run: npm run test:cargo -- --no-fail-fast --features bellwether-shell/conformance
      # W2: the black-box hook suite against this build's `serve` (the full npm test on
      # Windows, with its pinned skip list, is still to come).
      - name: The black-box hook suite against Bellwether serve
        run: |
          npm run build:dev
          node --import ./test/setup.mjs --test --test-concurrency=1 --test-timeout=120000 test/hook-route-blackbox.test.mjs
      - name: The test folder (unsigned; --features test-build,console-cli; Windows plan WD12)
        run: node scripts/build-windows-test.mjs
      # W2: the console CLI prints in the terminal with its exit codes, and the test build
      # refuses what would reach the live install.
      - name: The console CLI (bin\bellwether.exe through cli.cmd)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $dir = (Resolve-Path "shell/src-tauri/target-dev/windows-test/bellwether-windows-test").Path
          $v = & cmd /c "$dir\cli.cmd version"
          if ($LASTEXITCODE -ne 0 -or $v -notmatch '^bellwether \d+\.\d+\.\d+.* \(rust\)$') { Write-Output "::error::cli.cmd version: exit $LASTEXITCODE, '$v'"; exit 1 }
          Write-Output $v
          $r = & cmd /c "$dir\cli.cmd hooks install --write 2>&1"
          if ($LASTEXITCODE -ne 3 -or "$r" -notmatch 'never edits your own Claude Code settings') { Write-Output "::error::hooks install without --settings: exit $LASTEXITCODE, '$r'"; exit 1 }
          $r = & cmd /c "$dir\cli.cmd status --port 47417 2>&1"
          if ($LASTEXITCODE -ne 3) { Write-Output "::error::status on port 47417: exit $LASTEXITCODE, '$r'"; exit 1 }
          & cmd /c "$dir\cli.cmd token init"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & cmd /c "$dir\cli.cmd hooks print --out $dir\hooks.json"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$dir\hooks.json")) { exit 1 }
          & cmd /c "$dir\cli.cmd status"
          if ($LASTEXITCODE -ne 2) { Write-Output "::error::status with no brain should exit 2, got $LASTEXITCODE"; exit 1 }
          # The folder ships without a home or a token: the next steps' smoke runs, and the artifact, start clean.
          Remove-Item -Recurse -Force "$dir\home", "$dir\hooks.json"
      # The demo flock with a scratch home on the test port, for 25 s. A runner without an
      # interactive desktop opens no strip: then this says so as a warning and is skipped,
      # never passed (WD12 4).
      - name: Smoke run, run-test.cmd's demo with a scratch home
        shell: pwsh
        timeout-minutes: 3
        run: |
          $dir = "shell/src-tauri/target-dev/windows-test/bellwether-windows-test"
          $bwhome = Join-Path $env:RUNNER_TEMP "bw-smoke"
          New-Item -ItemType Directory -Force $bwhome | Out-Null
          $env:BELLWETHER_AGENT_DIR = (Resolve-Path $dir).Path
          $env:BELLWETHER_HOME = $bwhome
          $p = Start-Process -FilePath "$dir/Bellwether.exe" -ArgumentList "--demo","--demo-monitors","--heartbeat","--quit-after","25" -PassThru -Wait
          $log = Join-Path $bwhome "shell.log"
          $text = if (Test-Path $log) { Get-Content -Raw $log } else { "" }
          Write-Output "exit code $($p.ExitCode)"
          Write-Output $text
          if ($text -notmatch "strip strip-0 on monitor") {
            Write-Output "::warning title=Windows smoke run skipped::no strip opened (no interactive desktop on this runner?); exit code $($p.ExitCode). The maintainer's by-hand checks cover it."
            exit 0
          }
          foreach ($want in @("a tool window \(WS_EX_TOOLWINDOW", "taskbar on monitor", "--quit-after reached")) {
            if ($text -notmatch $want) { Write-Output "::error::the log has no line matching '$want'"; exit 1 }
          }
          if ($text -notmatch "webview: heartbeat 1:") { Write-Output "::warning::no heartbeat from the page in 25 s (WebView2 throttled on the runner, or slow to start)" }
      - name: --dump-desktop writes the desktop file (the test build answers it)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $dir = "shell/src-tauri/target-dev/windows-test/bellwether-windows-test"
          $out = Join-Path $env:RUNNER_TEMP "desktop.json"
          $env:BELLWETHER_AGENT_DIR = (Resolve-Path $dir).Path
          $env:BELLWETHER_HOME = Join-Path $env:RUNNER_TEMP "bw-dump"
          $p = Start-Process -FilePath "$dir/Bellwether.exe" -ArgumentList "--dump-desktop","$out" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) { Write-Output "::error::--dump-desktop exited $($p.ExitCode)"; exit 1 }
          $d = Get-Content -Raw $out | ConvertFrom-Json
          Write-Output "os $($d.os.version) $($d.os.displayVersion); $($d.monitors.Count) monitor(s); $($d.processes.Count) processes; $($d.windows.Count) windows"
          $d.monitors | ForEach-Object { Write-Output "  $($_.name) scale $($_.scale) rect $($_.rect -join ',') work $($_.work -join ',') taskbar $($_.taskbar) strip $($_.strip -join ',')" }
          if ($d.version -ne 1) { exit 1 }
      - name: Upload the test folder (bellwether-windows-test.zip)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bellwether-windows-test
          path: shell/src-tauri/target-dev/windows-test/bellwether-windows-test
          if-no-files-found: error
          retention-days: 30
