[package]
name = "bellwether-shell"
version = "1.1.1"
edition = "2021"
description = "bellwether's overlay: a transparent click-through strip of sheep, one per Claude Code session"
license = "MIT"
publish = false

# The brain crates (crates/core, crates/brain) share this workspace and its Cargo.lock.
[workspace]
members = [".", "../../crates/core", "../../crates/brain"]

[lib]
name = "bellwether_shell_lib"
crate-type = ["rlib"]

# `conformance`: the hidden `__` subcommands the conformance harness drives
# (test/conformance.mjs, scripts/differential.mjs; distribution plan D2). Dev and CI
# builds only. It is not a default feature, and neither `tauri build` nor
# scripts/build-app.mjs turns it on, so a release build answers `Bellwether __fixture`
# with "unknown command" (pinned by cli.rs's tests and the CI release check).
[features]
conformance = ["bellwether-brain/conformance"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
# Updates (plan D7, milestone 9): driven from Rust only (updater.rs); no capability grants
# an `updater:` permission, so no webview can reach it. rustls, no system proxy lookup.
tauri-plugin-updater = { version = "=2.13.2", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }
bellwether-brain = { path = "../../crates/brain" }
bellwether-core = { path = "../../crates/core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSBundle", "NSURL", "NSArray"] }
# The onboarding window's pet Import… panel (NSOpenPanel), from Rust only: the webviews get
# no dialog permission (plan D6, milestone 7; in the lockfile already, through tao). The
# update offer is an NSAlert from Rust too (updater.rs, milestone 9).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSApplication", "NSAlert", "NSButton", "NSControl", "NSView"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

# Dev builds run the conformance suite and the differential: the regex engine, the
# NFKC tables and the redaction scans are optimised even there, or 5 MB inputs would
# take seconds in a debug build. Release builds are unaffected.
[profile.dev.package.bellwether-core]
opt-level = 2
[profile.dev.package.regex]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.regex-automata]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.regex-syntax]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.aho-corasick]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.memchr]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.unicode-normalization]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.sha2]
opt-level = 3
# The brain's server stack, so a dev build's /hook latency is like a release build's
# (brain-server.test.mjs holds /hook p99 under 5 ms against either brain).
[profile.dev.package.bellwether-brain]
opt-level = 2
[profile.dev.package.tokio]
opt-level = 3
debug-assertions = false
[profile.dev.package.hyper]
opt-level = 3
debug-assertions = false
[profile.dev.package.hyper-util]
opt-level = 3
debug-assertions = false
[profile.dev.package.http]
opt-level = 3
[profile.dev.package.http-body-util]
opt-level = 3
[profile.dev.package.httparse]
opt-level = 3
[profile.dev.package.bytes]
opt-level = 3
[profile.dev.package.mio]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
