[package]
name = "pasture-shell"
version = "0.1.0"
edition = "2021"
description = "pasture's overlay: a transparent click-through strip of sheep, one per Claude Code session"
license = "MIT"
publish = false

[lib]
name = "pasture_shell_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
