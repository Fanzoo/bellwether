[package]
name = "bellwether-shell"
version = "0.1.0"
edition = "2021"
description = "bellwether's overlay: a transparent click-through strip of sheep, one per Claude Code session"
license = "MIT"
publish = false

# The brain crate (crates/brain) shares this workspace and its Cargo.lock.
[workspace]
members = [".", "../../crates/brain"]

[lib]
name = "bellwether_shell_lib"
crate-type = ["rlib"]

# `conformance`: the hidden `__` subcommands the conformance harness drives
# (test/conformance.mjs, scripts/differential.mjs; distribution plan D2). Dev and CI
# builds only. It is not a default feature, and neither `tauri build` nor
# scripts/build-app.mjs turns it on, so a release build answers `Bellwether __fixture`
# with "unknown command" (pinned by cli.rs's tests and the CI release check).
[features]
conformance = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }
bellwether-brain = { path = "../../crates/brain" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSBundle"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
